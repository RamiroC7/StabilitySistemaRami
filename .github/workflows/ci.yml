name: CI

# Corre en cada push a main y en cada Pull Request contra main. Asi, si
# alguien sube un cambio que rompe un test (o el build), queda marcado
# con una X roja en GitHub ANTES de que llegue a produccion — no depende
# de que alguien se acuerde de correr "npm run test" a mano.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + build
    runs-on: ubuntu-latest
    # Valores de mentira — src/lib/supabase.ts explota al importarse si no
    # encuentra estas dos variables, y useBusinessMetrics.ts (entre otros)
    # lo importa, aunque las funciones puras que testeamos no llamen a
    # Supabase de verdad. El .env real con las credenciales de produccion
    # nunca se sube al repo (por seguridad), asi que en CI no existe. Con
    # que la variable "exista" alcanza para que el chequeo pase.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Node-safe gate (@stability/domain)
        run: npm run check:node-safe

      - name: Correr tests (Vitest)
        run: npx vitest run

      - name: Lint
        run: npm run lint

      - name: Build de produccion
        run: npm run build
