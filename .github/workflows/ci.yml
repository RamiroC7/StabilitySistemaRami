name: CI

# Corre en cada push a main y en cada Pull Request contra main. Asi, si
# alguien sube un cambio que rompe un test (o el build), queda marcado
# con una X roja en GitHub ANTES de que llegue a produccion — no depende
# de que alguien se acuerde de correr "npm run test" a mano.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + build
    runs-on: ubuntu-latest
    # Valores de mentira — src/lib/supabase.ts explota al importarse si no
    # encuentra estas dos variables, y useBusinessMetrics.ts (entre otros)
    # lo importa, aunque las funciones puras que testeamos no llamen a
    # Supabase de verdad. El .env real con las credenciales de produccion
    # nunca se sube al repo (por seguridad), asi que en CI no existe. Con
    # que la variable "exista" alcanza para que el chequeo pase.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Node-safe gate (@stability/domain)
        run: npm run check:node-safe

      - name: rpe.ts no diverge de rpeHelpers.ts
        # packages/domain/src/rpe.ts (T13) es una COPIA deliberada de
        # src/lib/rpeHelpers.ts (no se importa para no tocar la app en esta
        # fase — ver design.md > Trade-offs > "Alcance de packages/domain").
        # Este step compara el docblock + la funcion (todo lo que viene desde
        # "Detects if the last 3 RPE...") en ambos archivos; si alguien edita
        # una copia y no la otra, CI falla ANTES del merge.
        run: |
          diff \
            <(grep -B1 -A20 "Detects if the last 3 RPE" src/lib/rpeHelpers.ts) \
            <(grep -B1 -A20 "Detects if the last 3 RPE" packages/domain/src/rpe.ts) \
          || (echo "::error::packages/domain/src/rpe.ts (copia) diverge de src/lib/rpeHelpers.ts (original). Actualiza la copia — ver el comentario en rpe.ts." && exit 1)

      - name: Correr tests (Vitest)
        run: npx vitest run

      - name: Lint
        run: npm run lint

      - name: Build de produccion
        run: npm run build

      - name: Migraciones SQL nuevas cumplen las reglas de rendimiento (R26/R27/R30)
        run: npm run check:migrations

      - name: Iconos de Material Symbols cubiertos por la fuente recortada (R10)
        run: npm run check:icons

      - name: Presupuestos de rendimiento (bundle, precache, imagenes, assets huerfanos)
        # Reglas en .claude/skills/rendimiento-stability/SKILL.md. Si falla, algo
        # pesado entro al camino critico o se commiteo un asset sin usar.
        run: npm run check:perf

      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium

      - name: E2E de rendimiento (Playwright contra el build)
        # Usa el dist/ recien buildeado (con las variables de mentira de arriba)
        # servido por `vite preview`; Supabase va mockeado en cada test.
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
